<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0c;
            color: #f4f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .social-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .social-links a:hover {
            color: #fff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .moment-card {
            position: relative;
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: 12px;
            background: #16161a;
        }
        .moment-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: grayscale(20%);
        }
        .moment-card:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }
    </style>
</head>
<body>

    <header>
        <h1>Life in Frames</h1>
        <div class="social-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Twitter</a>
            <a href="#" target="_blank">VSCO</a>
        </div>
    </header>

    <main class="gallery">
        <!-- Add your image links here -->
        <div class="moment-card">
            <img src="https://picsum.photos/seed/1/600/400" alt="Moment 1">
        </div>
        <div class="moment-card">
            <img src="https://picsum.photos/seed/2/600/400" alt="Moment 2">
        </div>
        <div class="moment-card">
            <img src="https://picsum.photos/seed/3/600/400" alt="Moment 3">
        </div>
        <div class="moment-card">
            <img src="https://picsum.photos/seed/4/600/400" alt="Moment 4">
        </div>
    </main>

</body>
</html>
