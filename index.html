<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0c;
            color: #f4f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .social-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .social-links a:hover {
            color: #fff;
        }
        /* News Section */
        #news-section {
            max-width: 800px;
            margin: 0 auto 4rem auto;
        }
        #news-section h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
            color: #ccc;
        }
        .news-grid {
            display: grid;
            gap: 1.5rem;
        }
        .news-card {
            background: #16161a;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #27272a;
        }
        .news-card h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .news-card p {
            color: #a1a1aa;
            font-size: 0.95rem;
        }
        .news-card .date {
            display: block;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #71717a;
        }
        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .moment-card {
            position: relative;
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: 12px;
            background: #16161a;
            cursor: pointer;
        }
        .moment-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: grayscale(20%);
        }
        .moment-card:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }
        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            cursor: zoom-out;
        }
        .lightbox.open {
            display: flex;
        }
        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Daily Moments</h1>
        <div class="social-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Twitter</a>
            <a href="#" target="_blank">VSCO</a>
        </div>
    </header>

    <section id="news-section">
        <h2>Daily Updates</h2>
        <div class="news-grid" id="news-container">
            Loading news...
        </div>
    </section>

    <main class="gallery">
        <div class="moment-card">
            <img src="https://picsum.photos/seed/1/600/400" alt="Moment 1">
        </div>
        <div class="moment-card">
            <img src="https://picsum.photos/seed/2/600/400" alt="Moment 2">
        </div>
        <div class="moment-card">
            <img src="https://picsum.photos/seed/3/600/400" alt="Moment 3">
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        // Lightbox functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.querySelectorAll('.moment-card img').forEach(img => {
            img.addEventListener('click', () => {
                lightboxImg.src = img.src;
                lightbox.classList.add('open');
            });
        });

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('open');
        });

        // Fetch and render news
        async function loadNews() {
            const container = document.getElementById('news-container');
            try {
                const response = await fetch('news.json');
                if (!response.ok) throw new Error('Failed to load news');
                const news = await response.json();
                
                container.innerHTML = news.map(item => `
                    <div class="news-card">
                        <h3>${item.title}</h3>
                        <p>${item.summary}</p>
                        <span class="date">${item.date || ''}</span>
                    </div>
                `).join('');
            } catch (error) {
                container.innerHTML = '<p>Unable to load latest updates.</p>';
            }
        }

        loadNews();
    </script>
</body>
</html>
