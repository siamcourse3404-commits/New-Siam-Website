<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Moments</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0a0a0c;
            color: #f4f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 2rem 1rem;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .social-links a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .social-links a:hover {
            color: #fff;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .moment-card {
            position: relative;
            aspect-ratio: 16/10;
            overflow: hidden;
            border-radius: 12px;
            background: #16161a;
            cursor: pointer;
        }
        .moment-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
            filter: grayscale(20%);
        }
        .moment-card:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        /* Lightbox (full picture view) */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            z-index: 1000;
            cursor: zoom-out;
        }
        .lightbox.open {
            display: flex;
        }
        .lightbox img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
        }
        .lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1.25rem;
            color: #fff;
            font-size: 2rem;
            line-height: 1;
            background: none;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <h1>Life in Frames</h1>
        <div class="social-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">Twitter</a>
            <a href="#" target="_blank">VSCO</a>
        </div>
    </header>

    <main class="gallery">
        <!-- Add your image links here -->
        <div class="moment-card">
            <img src="https://plain-apac-prod-public.komododecks.com/202611/04/MQW1QeEO6XfMQftm7Is5/image.jpg" alt="Moment 1">
        </div>
        <div class="moment-card">
            <img src="https://plain-apac-prod-public.komododecks.com/202611/04/0U8Gx8gvs7Mtb4vpuT1Z/image.jpg" alt="Moment 2">
        </div>
        <div class="moment-card">
            <img src="https://plain-apac-prod-public.komododecks.com/202611/04/k0T7P4lsNqOknnKqt9sh/image.jpg" alt="Moment 3">
        </div>
        <div class="moment-card">
            <img src="https://picsum.photos/seed/4/600/400" alt="Moment 4">
        </div>
    </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
        <img id="lightbox-img" src="" alt="">
    </div>

    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');

        document.querySelectorAll('.moment-card img').forEach(function (img) {
            img.addEventListener('click', function () {
                lightboxImg.src = img.src;
                lightboxImg.alt = img.alt;
                lightbox.classList.add('open');
            });
        });

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightboxImg.src = '';
        }

        lightbox.addEventListener('click', closeLightbox);
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeLightbox();
        });
    </script>

</body>
</html>
